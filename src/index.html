<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <title>Fabrizio Castro | Desarrollador Full Stack Junior</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio de Fabrizio Castro Barrientos - Desarrollador Web Full Stack Junior. Construyendo soluciones digitales con pasión, código limpio y aprendizaje constante.">
  <meta name="keywords" content="Fabrizio Castro, Desarrollador Web, Full Stack, Angular, React, Python, Flask, MongoDB, Lima, Perú">
  <meta name="author" content="Fabrizio Castro Barrientos">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Fabrizio Castro | Desarrollador Full Stack Junior">
  <meta property="og:description" content="Portfolio profesional de Fabrizio Castro Barrientos">
  <meta property="og:type" content="website">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Estilos críticos para evitar flash de contenido sin estilos */
    html {
      scroll-behavior: smooth;
    }
    
    html.dark {
      background-color: #0F172A;
      color: #E2E8F0;
    }
    
    html:not(.dark) {
      background-color: #F8FAFC;
      color: #1E293B;
    }
    
    /* Loader inicial */
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F172A;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    
    #initial-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    
    .loader-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366F1 0%, #06B6D4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: loaderPulse 2s ease-in-out infinite;
    }
    
    @keyframes loaderPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    
    .loader-bar {
      width: 120px;
      height: 3px;
      background: #1E293B;
      border-radius: 3px;
      overflow: hidden;
    }
    
    .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366F1, #06B6D4);
      animation: loaderFill 1.5s ease-out forwards;
    }
    
    @keyframes loaderFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Loader inicial -->
  <div id="initial-loader">
    <div class="loader-content">
      <div class="loader-logo">FC</div>
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>
  </div>
  
  <app-root></app-root>
  
  <script>
    // Ocultar loader inicial cuando la app Angular cargue
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 500);
        }
      }, 1500);
    });
  </script>
</body>
</html>
